name: Check and plan workflow

on:
  push:
  pull_request:

jobs:
  checks:
    name: fmt, validate, lint, scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v3

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.x"
        
      - name: format
        run: terraform fmt -check -recursive

      - name: init
        run: terraform init -backend=false

      - name: validate
        run: terraform validate

      - name: lint
        uses: terraform-linters/setup-tflint@v4
      
      - run: tflint --init && tflint --recursive

      - name: Security scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          exit-code: "1"                # fail the job on findings
          severity: HIGH,CRITICAL
  plan:
    name: plan
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with: 
          terraform_version: "1.13.x"
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: us-east-1
          role-to-assume: ${{vars.PLAN_ROLE_ARN}}

      - run: terraform init

      - name: plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan | tee plan.txt
          # write a collapsible summary to the run's Summary page
          {
            echo "## Terraform plan"
            echo '```'
            tail -c 60000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8').slice(-60000);
            const body = [
              '#### Terraform plan',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              plan,
              '```',
              '</details>',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });




