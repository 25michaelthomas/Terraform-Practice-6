name: input workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        type: choice
        options: [dev, staging, prod]
        required: true
      action:
        type: choice
        options: [plan, apply, destroy]
        default: plan
      auto_approve:
        type: boolean
        default: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # picks up that env's secrets + protection rules
    steps:
      - run: echo "Running ${{ inputs.action }} against ${{ inputs.environment }}"





